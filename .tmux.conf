unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

set -g default-terminal "tmux-256color"
set -g default-shell /bin/bash
set -g default-command "bash -l"
# Modern terminal capability declarations (tmux 3.2+)
set -ga terminal-features ",*:RGB"        # truecolor (replaces old "Tc" override)
set -ga terminal-features ",*:sync"       # synchronized output (DECSET 2026) — big win for nvim scrolling
set -ga terminal-features ",*:usstyle"    # underline styles + colors (undercurl)
set -g focus-events on
set -gq utf8 on
set -sg escape-time 0
set -g repeat-time 1000
set -g assume-paste-time 0
set -g base-index 1
set -g pane-base-index 1
set -g renumber-windows on
set -g history-limit 50000

# New window opens in same directory as current pane.
# WM_FORCE_PICKER tells .bash_profile to run the interactive environment picker
# even when the inherited path is a worktree. Without it, opening a window from
# a workmux pane would inherit that worktree path, and the profile's
# worktree-detection would skip the picker — panes workmux creates should skip
# it, a window you opened by hand should not.
bind c new-window -c "#{pane_current_path}" -e WM_FORCE_PICKER=1

# New window SSHed into bastion
bind B new-window -n bastion "TERM=xterm ssh vcloud-bastion"

# New window running Claude (Postgres RMS dev env)
bind C new-window -n claude "bash -lc '. /usr/local/bin/setup_recenv.vtmpgsql.dev && cd $VDXDIR && exec claude'"

# --- Pane navigation: Alt+h/j/k/l (no prefix needed, no conflicts) ---
bind -n M-h select-pane -L
bind -n M-j select-pane -D
bind -n M-k select-pane -U
bind -n M-l select-pane -R

# --- Splits: prefix + \ or | (vertical), prefix + - (horizontal) ---
bind \\ split-window -h -c "#{pane_current_path}"
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# --- Resize panes: prefix + H/J/K/L (repeatable) ---
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# --- Kill pane without confirm ---
bind x kill-pane

# --- Claude window switcher: fuzzy-pick by state + last-message summary ---
bind S display-popup -E -w 90% -h 70% "~/.tmux/scripts/claude-summary-popup.sh"

# --- Quick reload ---
bind r source-file ~/.tmux.conf \; display-message "Config reloaded"

# --- Mouse support ---
set -g mouse on
set -g set-clipboard on
# Declare the outer terminal supports OSC 52 writes (Windows Terminal does)
set -ga terminal-features ',*:clipboard'

# DESIGN TWEAKS

# DESIGN TWEAKS
set -g visual-activity off
set -g visual-bell off
set -g visual-silence off
setw -g monitor-activity off

# --- Catppuccin Mocha ---
# Minimal by design: session name + clock only, "basic" window style (no
# pill/rounded shapes — those bled visually once icons got added last time),
# no bell/state icons in the window text — `workmux sidebar` already covers
# per-agent status on the left, so the window tabs stay plain and quiet.
set -g @catppuccin_flavor 'mocha'
set -g @catppuccin_window_status_style "basic"
run '~/.tmux/plugins/catppuccin-tmux/catppuccin.tmux'

set -g status-position bottom
set -g status-left "#{E:@catppuccin_status_session}"
set -g status-right "#{E:@catppuccin_status_date_time}"

# Only highlight when the FOCUSED pane is specifically the workmux sidebar —
# typing away in a claude/zsh pane should look muted regardless of focus;
# clicking into the sidebar to actually navigate/select an agent is what
# should pop.
set -g pane-border-style "fg=colour238"
set -g pane-active-border-style "#{?#{==:#{pane_current_command},workmux},fg=colour226#,bold,fg=colour238}"

#-------- Copy Mode (Vim Style) {{{
#------------------------------------------------------
# This section of hotkeys mainly work in copy mode and no where else

# vim keys in copy and choose mode
set-window-option -g mode-keys vi

# copying selection vim style
# http://jasonwryan.com/blog/2011/06/07/copy-and-paste-in-tmux/
# https://github.com/myfreeweb/dotfiles/blob/master/tmux.conf
bind-key Escape copy-mode			# enter copy mode; default [
bind-key p paste-buffer				# paste; (default hotkey: ] )
bind-key P choose-buffer 			# tmux clipboard history
bind-key + delete-buffer \; display-message "Deleted current Tmux Clipboard History"

# Copy mode: vim-style selection, copy goes to system clipboard via OSC 52
# (OSC 52 works over SSH — Windows Terminal supports it natively)
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi V send-keys -X select-line
bind-key -T copy-mode-vi C-v send-keys -X begin-selection \; send-keys -X rectangle-toggle
bind-key -T choice-mode-vi h send-keys -X tree-collapse
bind-key -T choice-mode-vi l send-keys -X tree-expand
bind-key -T choice-mode-vi H send-keys -X tree-collapse-all
bind-key -T choice-mode-vi L send-keys -X tree-expand-all
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel

# --- TPM (keep at very bottom) ---
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
run '~/.tmux/plugins/tpm/tpm'

